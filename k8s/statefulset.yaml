apiVersion: v1
kind: Namespace
metadata:
  name: cronicle
  labels:
    app.kubernetes.io/name: cronicle
---
apiVersion: v1
kind: Secret
metadata:
  name: cronicle-secret
  namespace: cronicle
  labels:
    app.kubernetes.io/name: cronicle
type: Opaque
stringData:
  # Must contain at least one letter or special character (not purely numeric)
  secret_key: "change-me-cronicle-secret"
  default_api_key: ""
---
# Headless service — stable DNS: cronicle-0.cronicle.cronicle.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: cronicle-headless
  namespace: cronicle
  labels:
    app.kubernetes.io/name: cronicle
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: cronicle
  ports:
    - name: http
      port: 3012
      targetPort: http
    - name: discovery
      port: 3014
      targetPort: discovery
      protocol: UDP
---
# ClusterIP service for UI / ingress backends
apiVersion: v1
kind: Service
metadata:
  name: cronicle
  namespace: cronicle
  labels:
    app.kubernetes.io/name: cronicle
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cronicle
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cronicle
  namespace: cronicle
  labels:
    app.kubernetes.io/name: cronicle
spec:
  serviceName: cronicle-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: cronicle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cronicle
        app.kubernetes.io/component: manager
    spec:
      # Stable hostname used for manager eligibility / global/servers registration
      hostname: cronicle-0
      subdomain: cronicle-headless
      terminationGracePeriodSeconds: 60
      securityContext:
        # Match image GID so PVC data stays writable across reschedules
        fsGroup: 1099
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: cronicle
          image: ghcr.io/ayomide101/cronicle-edge:v1.14.7
          imagePullPolicy: IfNotPresent
          args: ["manager"]
          ports:
            - name: http
              containerPort: 3012
              protocol: TCP
            - name: discovery
              containerPort: 3014
              protocol: UDP
          env:
            - name: TZ
              value: UTC
            - name: CRONICLE_foreground
              value: "1"
            - name: CRONICLE_echo
              value: "1"
            # Keep base URL in sync with how clients reach the service
            - name: CRONICLE_base_app_url
              value: "http://cronicle.cronicle.svc.cluster.local:3012"
            - name: CRONICLE_secret_key
              valueFrom:
                secretKeyRef:
                  name: cronicle-secret
                  key: secret_key
            - name: CRONICLE_api_key
              valueFrom:
                secretKeyRef:
                  name: cronicle-secret
                  key: default_api_key
            # Pin hostname used in storage registration (matches StatefulSet identity)
            - name: HOSTNAME
              value: cronicle-0
            # Optional: skip demo setup content on first init
            # - name: CRONICLE_setup
            #   value: minimal
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/cronicle/data
            - name: logs
              mountPath: /opt/cronicle/logs
            - name: queue
              mountPath: /opt/cronicle/queue
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: logs
          emptyDir: {}
        - name: queue
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: cronicle
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: standard   # set if your cluster has no default StorageClass
        resources:
          requests:
            storage: 10Gi
